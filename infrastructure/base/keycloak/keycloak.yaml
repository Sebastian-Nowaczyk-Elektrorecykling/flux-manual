apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: bitnami
  namespace: keycloak
spec:
  interval: 12h
  url: https://charts.bitnami.com/bitnami
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  namespace: keycloak
spec:
  instances: 3
  storage:
    size: 10Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 10m
  chart:
    spec:
      chart: keycloak
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: keycloak
  values:
    # Disable the sub-chart Postgres
    postgresql:
      enabled: false
    
    # Configure the external CNPG database
    externalDatabase:
      host: keycloak-db-rw.keycloak.svc.cluster.local
      port: 5432
      database: keycloak
      user: keycloak
      existingSecret: keycloak-db-app
      existingSecretPasswordKey: password

    # Keycloak Admin settings (Recommended to use a pre-created secret for production)
    auth:
      adminUser: admin
      adminPassword: "1234"

    # Best Practice for production
    production: true
    proxy: edge
