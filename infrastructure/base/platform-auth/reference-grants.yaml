apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: longhorn-external-auth
  namespace: platform-auth
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: longhorn-system

  to:
    - group: ""
      kind: Service
      name: platform-auth
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: monitoring-external-auth
  namespace: platform-auth
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring

  to:
    - group: ""
      kind: Service
      name: platform-auth
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: kube-system-external-auth
  namespace: platform-auth
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system

  to:
    - group: ""
      kind: Service
      name: platform-auth
