apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-agent
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - kube-system

  selector:
    matchLabels:
      k8s-app: cilium

  endpoints:
    - port: prometheus
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cilium-operator
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - kube-system

  selector:
    matchLabels:
      io.cilium/app: operator

  endpoints:
    - port: prometheus
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hubble
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - kube-system

  selector:
    matchLabels:
      k8s-app: hubble

  endpoints:
    - port: hubble-metrics
      interval: 30s
