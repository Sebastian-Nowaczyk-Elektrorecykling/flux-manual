apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 12h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m

  chart:
    spec:
      chart: kube-prometheus-stack
      version: "88.6.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    crds:
      enabled: true

    grafana:
      enabled: true

      persistence:
        enabled: true
        storageClassName: longhorn
        size: 5Gi

      # Do not expose using the chart's own Ingress.
      ingress:
        enabled: false

    prometheus:
      enabled: true

      prometheusSpec:
        retention: 15d

        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 20Gi

        # Discover ServiceMonitors throughout the cluster,
        # including Cilium/Longhorn/CNPG monitors.
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false

        serviceMonitorNamespaceSelector: {}
        podMonitorNamespaceSelector: {}

    alertmanager:
      enabled: true

      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 2Gi

    kubeStateMetrics:
      enabled: true

    nodeExporter:
      enabled: true
