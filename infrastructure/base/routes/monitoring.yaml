apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: platform
      namespace: gateway-system
      sectionName: https

  hostnames:
    - grafana.internal

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

      filters:
        - type: ExternalAuth
          externalAuth:
            protocol: HTTP

            http:
              path: /authorize

              allowedHeaders:
                - Authorization
                - Cookie
                - X-Forwarded-For
                - X-Forwarded-Host
                - X-Forwarded-Proto

              allowedResponseHeaders:
                - X-Platform-Subject
                - X-Platform-Username
                - X-Platform-Email
                - X-Platform-Groups

      backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
