apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m

  chart:
    spec:
      chart: cilium
      version: "1.20.1"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system

  values:
    kubeProxyReplacement: true

    gatewayAPI:
      enabled: true

      hostNetwork:
        enabled: true

    prometheus:
      enabled: true

    operator:
      prometheus:
        enabled: true

    hubble:
      enabled: true

      relay:
        enabled: true

      ui:
        enabled: true

      metrics:
        enableOpenMetrics: true
        enabled:
          - dns:query;ignoreAAAA
          - drop
          - tcp
          - flow
          - icmp
          - httpV2
